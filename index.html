    <script>
      // Mobilde yalnızca haritanın yakınlaşmasını sağlamak; üst başlık, menü ve çerçevelerin ekrandan kaybolmasını önlemek için sayfa zoomunu kilitle
      (function() {
        // iOS Safari gesturestart/gesturechange/gestureend engelleme (tüm sayfa yakınlaşmasını kilitler)
        document.addEventListener('gesturestart', function (e) {
          e.preventDefault();
        }, { passive: false });
        document.addEventListener('gesturechange', function (e) {
          e.preventDefault();
        }, { passive: false });
        document.addEventListener('gestureend', function (e) {
          e.preventDefault();
        }, { passive: false });

        // Harita dışındaki UI çerçevelerinde (Header, TabBar, Menü) çoklu parmakla sayfa esnetme zoomunu engelle
        document.addEventListener('touchstart', function (e) {
          if (e.touches.length > 1) {
            var target = e.target;
            if (!target || !target.closest || !target.closest('#railway-map-container')) {
              e.preventDefault();
            }
          }
        }, { passive: false });

        // Çerçevelere hızlı çift dokunulduğunda Safari akıllı zoomunun arayüzü büyütmesini engelle
        var lastTouchEnd = 0;
        document.addEventListener('touchend', function (e) {
          var now = Date.now();
          if (now - lastTouchEnd <= 300) {
            var target = e.target;
            if (target && target.closest && !target.closest('#railway-map-container')) {
              var tag = target.tagName ? target.tagName.toLowerCase() : '';
              if (tag !== 'input' && tag !== 'textarea' && tag !== 'select') {
                e.preventDefault();
                if (typeof target.click === 'function') {
                  target.click();
                }
              }
            }
          }
          lastTouchEnd = now;
        }, { passive: false });
      })();
    </script>
