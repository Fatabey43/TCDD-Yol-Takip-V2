<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient (Deep Institutional TCDD Midnight to Royal Blue) -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a192f" />
      <stop offset="45%" stop-color="#0f2b48" />
      <stop offset="80%" stop-color="#123d68" />
      <stop offset="100%" stop-color="#0c2340" />
    </linearGradient>

    <!-- Top Ambient Light Glow -->
    <radialGradient id="topAura" cx="50%" cy="25%" r="65%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.45" />
      <stop offset="50%" stop-color="#0369a1" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0" />
    </radialGradient>

    <!-- Red TCDD Crimson Brand Gradient -->
    <linearGradient id="crimsonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="50%" stop-color="#e11d48" />
      <stop offset="100%" stop-color="#be123c" />
    </linearGradient>

    <!-- Metallic Steel Rail Gradient -->
    <linearGradient id="steelRail" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94a3b8" />
      <stop offset="35%" stop-color="#ffffff" />
      <stop offset="70%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#64748b" />
    </linearGradient>

    <!-- Golden KM Accent Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="40%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>

    <!-- Drop Shadow Filter for Train -->
    <filter id="trainShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#020617" flood-opacity="0.65" />
    </filter>

    <!-- Headlight Glow Filter -->
    <filter id="headlightGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Full-bleed Background for iOS Squircle & Android Adaptive Icon Canvas -->
  <rect width="512" height="512" fill="url(#bgGradient)" />
  <rect width="512" height="512" fill="url(#topAura)" />

  <!-- Subtle Concentric Radar / Geolocation Range Rings -->
  <circle cx="256" cy="275" r="195" fill="none" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.12" stroke-dasharray="6 6" />
  <circle cx="256" cy="275" r="145" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.18" />
  <circle cx="256" cy="275" r="95" fill="none" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.2" />

  <!-- SAFE ZONE CONTENT (Centered strictly inside ~340px circle) -->

  <!-- 1. Converging Perspective Railway Tracks -->
  <g id="tracks" opacity="0.95">
    <!-- Ballast Bed -->
    <polygon points="256,260 148,446 364,446" fill="#071426" opacity="0.7" />

    <!-- Railway Sleepers (Horizontal Ties with metallic highlights) -->
    <polygon points="246,282 266,282 268,287 244,287" fill="#334155" stroke="#475569" stroke-width="0.8" />
    <polygon points="238,299 274,299 277,305 235,305" fill="#334155" stroke="#64748b" stroke-width="0.8" />
    <polygon points="228,319 284,319 288,327 224,327" fill="#475569" stroke="#64748b" stroke-width="1" />
    <polygon points="214,343 298,343 303,353 209,353" fill="#475569" stroke="#94a3b8" stroke-width="1.2" />
    <polygon points="197,372 315,372 321,384 191,384" fill="#64748b" stroke="#cbd5e1" stroke-width="1.4" />
    <polygon points="174,407 338,407 346,422 166,422" fill="#64748b" stroke="#e2e8f0" stroke-width="1.6" />

    <!-- Left Steel Rail (Polished Silver 3D Beam) -->
    <polygon points="251,256 255,256 166,448 152,448" fill="url(#steelRail)" />
    <line x1="253" y1="256" x2="160" y2="448" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />

    <!-- Right Steel Rail (Polished Silver 3D Beam) -->
    <polygon points="257,256 261,256 360,448 346,448" fill="url(#steelRail)" />
    <line x1="259" y1="256" x2="352" y2="448" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- 2. High-Speed Aerodynamic Bullet Train Emblem (Front 3D Perspective) -->
  <g id="bulletTrain" filter="url(#trainShadow)">
    <!-- Aerodynamic Cabin Outer Shell (Pure White & Cool Grey) -->
    <path d="M 256,128 
             C 230,128 206,140 198,168 
             L 186,236 
             C 182,258 185,285 190,305 
             L 204,324 
             C 214,330 234,334 256,334 
             C 278,334 298,330 308,324 
             L 322,305 
             C 327,285 330,258 326,236 
             L 314,168 
             C 306,140 282,128 256,128 Z" 
          fill="#f8fafc" stroke="#e2e8f0" stroke-width="2" />

    <!-- Cabin Top Bevel Highlight -->
    <path d="M 256,132 C 235,132 216,142 208,164 L 202,210 C 218,202 236,198 256,198 C 276,198 294,202 310,210 L 304,164 C 296,142 277,132 256,132 Z" 
          fill="#ffffff" opacity="0.6" />

    <!-- Aerodynamic Crimson Stripe across nose -->
    <path d="M 186,242 L 184,264 C 184,272 188,280 200,286 L 256,296 L 312,286 C 324,280 328,272 328,264 L 326,242 C 304,254 278,260 256,260 C 234,260 208,254 186,242 Z" 
          fill="url(#crimsonGrad)" />

    <!-- Sleek Panoramic Tinted Windshield -->
    <path d="M 256,154 
             C 238,154 220,160 212,172 
             L 204,208 
             C 218,214 236,218 256,218 
             C 276,218 294,214 308,208 
             L 300,172 
             C 292,160 274,154 256,154 Z" 
          fill="#0c1e33" stroke="#1e293b" stroke-width="1.5" />

    <!-- Windshield Reflection Glare -->
    <path d="M 216,178 L 228,172 L 236,214 L 224,215 Z" fill="#38bdf8" opacity="0.35" />
    <path d="M 244,166 L 248,164 L 252,216 L 248,216 Z" fill="#ffffff" opacity="0.25" />

    <!-- High-Tech Center Front Camera / Milestone Radar -->
    <circle cx="256" cy="144" r="5" fill="#0f172a" />
    <circle cx="256" cy="144" r="3" fill="#38bdf8" />
    <circle cx="255" cy="143" r="1.2" fill="#ffffff" />

    <!-- Headlight Left -->
    <g filter="url(#headlightGlow)">
      <ellipse cx="214" cy="286" rx="10" ry="6" fill="#fef08a" />
      <ellipse cx="214" cy="286" rx="6" ry="3.5" fill="#ffffff" />
    </g>

    <!-- Headlight Right -->
    <g filter="url(#headlightGlow)">
      <ellipse cx="298" cy="286" rx="10" ry="6" fill="#fef08a" />
      <ellipse cx="298" cy="286" rx="6" ry="3.5" fill="#ffffff" />
    </g>

    <!-- Front Cowcatcher Grill Lines -->
    <line x1="234" y1="316" x2="278" y2="316" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" />
    <line x1="240" y1="323" x2="272" y2="323" stroke="#64748b" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- 3. Upper Institutional Brand Pill: "TCDD" -->
  <g id="tcddBrand">
    <!-- Backing Badge Plate -->
    <rect x="186" y="58" width="140" height="42" rx="21" fill="#0a192f" stroke="#38bdf8" stroke-width="1.8" stroke-opacity="0.8" />
    <rect x="189" y="61" width="134" height="36" rx="18" fill="url(#crimsonGrad)" />
    
    <!-- Bold Typography: TCDD -->
    <text x="256" y="87" 
          font-family="system-ui, -apple-system, 'SF Pro Display', Roboto, 'Segoe UI', sans-serif" 
          font-weight="900" 
          font-size="23" 
          letter-spacing="5" 
          fill="#ffffff" 
          text-anchor="middle"
          stroke="#000000"
          stroke-width="0.3">
      TCDD
    </text>
  </g>

  <!-- 4. Lower Milestone Floating Badge: "KM TAKİP" -->
  <g id="kmBadge" filter="url(#trainShadow)">
    <!-- Shield / Capsule Container -->
    <rect x="166" y="366" width="180" height="44" rx="22" fill="#020617" stroke="#fbbf24" stroke-width="2" />
    
    <!-- Inner Subtle Glass Gradient -->
    <rect x="169" y="369" width="174" height="38" rx="19" fill="#0f172a" />
    
    <!-- GPS Location Indicator Dot -->
    <circle cx="192" cy="388" r="6" fill="#ef4444" />
    <circle cx="192" cy="388" r="2.5" fill="#ffffff" />
    
    <!-- Text: KM TAKİP -->
    <text x="258" y="396" 
          font-family="system-ui, -apple-system, 'SF Pro Display', Roboto, 'Segoe UI', sans-serif" 
          font-weight="900" 
          font-size="19" 
          letter-spacing="2.5" 
          fill="url(#goldGrad)" 
          text-anchor="middle">
      KM TAKİP
    </text>
  </g>

  <!-- Sleek Top Gloss Arc -->
  <path d="M 0,0 L 512,0 C 512,120 400,200 256,200 C 112,200 0,120 0,0 Z" fill="#ffffff" opacity="0.04" pointer-events="none" />
</svg>
